version: "3.9"

services:
  neo4j-db:
    image: neo4j:5.19
    container_name: neo4j-db
    # restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  kg-builder-app:
    build: .
    container_name: kg-builder-app
    depends_on:
      - neo4j-db
      - ollama
    environment:
      NEO4J_URI: bolt://neo4j-db:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./data:/app/data
    working_dir: /app/src
    command: ["python", "knowledge_graph_builder.py"]

volumes:
  neo4j_data:
  ollama_data:
