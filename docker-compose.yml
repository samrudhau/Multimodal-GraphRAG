services:
  neo4j-db:
    image: neo4j:5.23
    container_name: neo4j-db
    environment:
      - NEO4J_AUTH=neo4j/my_neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  kg-builder-app:
    build: .
    container_name: kg-builder-app
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_password
      - OLLAMA_HOST=http://ollama:11434   # added this line
    depends_on:
      - neo4j-db
      - ollama
    secrets:
      - neo4j_password
    networks:
      - app-network

environment:
  - OLLAMA_HOST=http://ollama:11434

volumes:
  neo4j_data:
  ollama_data:
